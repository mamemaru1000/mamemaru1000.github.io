<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まめ丸 - Home</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
      background: linear-gradient(180deg, #faf8f5 0%, #f5f0e8 100%);
      min-height: 100vh;
      color: #3d3a35;
      line-height: 1.6;
    }
    a { color: #7d6b5a; text-decoration: none; }
    a:hover { color: #5c4d3f; }

    .container { max-width: 640px; margin: 0 auto; padding: 0 1.5rem 3rem; }

    /* Header */
    header {
      padding: 1.5rem 0;
      border-bottom: 1px solid rgba(212, 196, 168, 0.4);
    }
    .site-name {
      font-size: 1.375rem;
      font-weight: 600;
      margin: 0 0 1rem 0;
      color: #2c2925;
    }
    .site-name a { color: inherit; }
    nav {
      display: flex;
      gap: 1.25rem;
      font-size: 0.9375rem;
    }
    nav a {
      transition: color 0.2s ease;
    }
    nav a[href="index.html"] { font-weight: 600; color: #5c4d3f; }

    /* Profile */
    .profile {
      margin-top: 2.5rem;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      display: grid;
      gap: 1.5rem;
      align-items: center;
      justify-items: center;
    }
    @media (min-width: 480px) {
      .profile {
        grid-template-columns: auto 1fr;
        justify-items: start;
        text-align: left;
      }
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8dcc8 0%, #d4c4a8 100%);
      color: #6b5b4a;
      font-size: 1.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .profile-text h2 {
      font-size: 1.125rem;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
      color: #2c2925;
    }
    .profile-text p { margin: 0; font-size: 0.9375rem; color: #5a554d; }

    /* Note link */
    .links { margin-top: 2rem; }
    .links h2 { font-size: 1rem; font-weight: 600; color: #4a4540; margin: 0 0 0.75rem 0; }
    .link-card {
      display: block;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(212, 196, 168, 0.4);
      border-radius: 0.75rem;
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      border-color: rgba(212, 196, 168, 0.7);
    }
    .link-card .label { font-weight: 600; font-size: 1.0625rem; color: #2c2925; }
    .link-card .desc { font-size: 0.875rem; color: #6b6359; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="site-name"><a href="index.html">まめ丸</a></h1>
      <nav aria-label="メインメニュー">
        <a href="index.html">ホーム</a>
        <a href="works.html">作品集</a>
      </nav>
    </header>

    <main>
      <section class="profile" aria-labelledby="profile-heading">
        <div class="avatar" aria-hidden="true">ま</div>
        <div class="profile-text">
          <h2 id="profile-heading">まめ丸</h2>
          <p>
            こんにちは、まめ丸です。日々のアイデアや作ったものを少しずつ残しています。
            このサイトではプロフィールと作品へのリンクをまとめています。よかったらのぞいてみてください。
          </p>
        </div>
      </section>

      <section class="links" aria-labelledby="links-heading">
        <h2 id="links-heading">Links</h2>
        <a class="link-card" href="https://note.com/mamemaru1000" target="_blank" rel="noopener noreferrer">
          <span class="label">note</span>
          <span class="desc">記事を読む →</span>
        </a>
      </section>
    </main>
  </div>
</body>
</html>
